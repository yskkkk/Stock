<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1e5fc4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YSTOCK" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=19" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=19" />
    <title>YSTOCK</title>
    <script src="/stock-boot-cache.js"></script>
    <script>
      window.__STOCK_BOOT = 0;
      (function () {
        try {
          var k = "stock-app-color-theme";
          var v = localStorage.getItem(k);
          var mode = v === "light" || v === "dark" ? v : "light";
          if (mode === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var p = localStorage.getItem("stock-app-light-palette");
            var ok = ["mist", "paper", "sage", "lavender", "sand", "dusk"];
            document.documentElement.setAttribute(
              "data-light-palette",
              p && ok.indexOf(p) >= 0 ? p : "mist",
            );
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://s3.tradingview.com" />
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin />
    <link rel="preconnect" href="https://www.tradingview.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <div
        class="launch-shell launch-shell--loading"
        aria-busy="true"
        style="
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
          background: #f1f5f9;
          color: #475569;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
          font-size: 0.95rem;
        "
      >
        <p style="margin: 0">불러오는 중…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:1rem;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
        자바스크립트가 꺼져 있어 화면을 표시할 수 없습니다.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function stockBootHint() {
        try {
          return (
            (window.__stockBootCache && window.__stockBootCache.cacheHintText()) ||
            "캐시·네트워크 문제일 수 있습니다."
          );
        } catch (e) {
          return "캐시·네트워크 문제일 수 있습니다.";
        }
      }

      function stockClearCacheAndReload() {
        try {
          if (window.__stockBootCache && window.__stockBootCache.clearAll) {
            window.__stockBootCache.clearAll({ reload: true, resetPurgeFlag: true });
            return;
          }
        } catch (e) {}
        location.reload();
      }

      function stockShowBootError(detail) {
        try {
          var root = document.getElementById("root");
          if (!root) return;
          if (window.__STOCK_BOOT >= 2) return;
          root.innerHTML =
            '<div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.25rem;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9;color:#0f172a;">' +
            '<div style="width:min(520px,100%);border:1px solid rgba(15,23,42,.12);background:#fff;border-radius:12px;padding:1rem 1.05rem;box-shadow:0 8px 28px rgba(15,23,42,.08);">' +
            '<div style="font-weight:800;letter-spacing:-0.02em;margin:0 0 .35rem;">화면을 표시할 수 없습니다</div>' +
            '<div style="font-size:.9rem;line-height:1.55;color:#64748b;white-space:pre-wrap;">' +
            String(detail || "앱 스크립트를 불러오지 못했습니다.") +
            "</div>" +
            '<div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.85rem;">' +
            '<button type="button" onclick="location.reload()" style="padding:.45rem .85rem;border-radius:8px;border:1px solid rgba(15,23,42,.15);background:#1e5fc4;color:#fff;font-weight:600;">새로고침</button>' +
            '<button type="button" onclick="stockClearCacheAndReload()" style="padding:.45rem .85rem;border-radius:8px;border:1px solid rgba(15,23,42,.15);background:#fff;color:#0f172a;font-weight:600;">캐시 삭제 후 재시도</button>' +
            "</div></div></div>";
        } catch (e) {}
      }

      window.stockClearCacheAndReload = stockClearCacheAndReload;

      window.addEventListener("error", function (ev) {
        if (window.__STOCK_BOOT >= 2) return;
        var msg = (ev && ev.message) || "스크립트 오류";
        stockShowBootError(msg + "\n\n" + stockBootHint());
      });

      setTimeout(function () {
        if (window.__STOCK_BOOT >= 2) return;
        stockShowBootError("앱이 시작되지 않았습니다.\n\n" + stockBootHint());
      }, (window.__stockBootCache && window.__stockBootCache.bootTimeoutMs()) || 15000);
    </script>
  </body>
</html>
