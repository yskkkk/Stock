<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1e5fc4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YSTOCK" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=19" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=19" />
    <title>YSTOCK</title>
    <script>
      window.__STOCK_BOOT = 0;
      (function () {
        var PURGE_KEY = "stock-pwa-boot-purge-v2";
        try {
          if (localStorage.getItem(PURGE_KEY) === "1") return;
          localStorage.setItem(PURGE_KEY, "1");
        } catch (e) {
          return;
        }
        if (!("serviceWorker" in navigator) && !("caches" in window)) return;
        var reloaded = false;
        function maybeReload() {
          if (reloaded) return;
          reloaded = true;
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            location.reload();
          }
        }
        var tasks = [];
        if ("caches" in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            }),
          );
        }
        if ("serviceWorker" in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                }),
              );
            }),
          );
        }
        Promise.all(tasks).then(maybeReload).catch(function () {});
      })();
      (function () {
        try {
          var k = "stock-app-color-theme";
          var v = localStorage.getItem(k);
          var mode = v === "light" || v === "dark" ? v : "light";
          if (mode === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var p = localStorage.getItem("stock-app-light-palette");
            var ok = ["mist", "paper", "sage", "lavender", "sand", "dusk"];
            document.documentElement.setAttribute(
              "data-light-palette",
              p && ok.indexOf(p) >= 0 ? p : "mist",
            );
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://s3.tradingview.com" />
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin />
    <link rel="preconnect" href="https://www.tradingview.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <div
        class="launch-shell launch-shell--loading"
        aria-busy="true"
        style="
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
          background: #f1f5f9;
          color: #475569;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
          font-size: 0.95rem;
        "
      >
        <p style="margin: 0">불러오는 중…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:1rem;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
        자바스크립트가 꺼져 있어 화면을 표시할 수 없습니다.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function stockShowBootError(detail) {
        try {
          var root = document.getElementById("root");
          if (!root) return;
          if (window.__STOCK_BOOT >= 2) return;
          root.innerHTML =
            '<div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.25rem;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9;color:#0f172a;">' +
            '<div style="width:min(520px,100%);border:1px solid rgba(15,23,42,.12);background:#fff;border-radius:12px;padding:1rem 1.05rem;box-shadow:0 8px 28px rgba(15,23,42,.08);">' +
            '<div style="font-weight:800;letter-spacing:-0.02em;margin:0 0 .35rem;">화면을 표시할 수 없습니다</div>' +
            '<div style="font-size:.9rem;line-height:1.55;color:#64748b;white-space:pre-wrap;">' +
            String(detail || "앱 스크립트를 불러오지 못했습니다.") +
            "</div>" +
            '<button type="button" onclick="location.reload()" style="margin-top:.85rem;padding:.45rem .85rem;border-radius:8px;border:1px solid rgba(15,23,42,.15);background:#1e5fc4;color:#fff;font-weight:600;">새로고침</button>' +
            "</div></div>";
        } catch (e) {}
      }

      window.addEventListener("error", function (ev) {
        if (window.__STOCK_BOOT >= 2) return;
        var msg = (ev && ev.message) || "스크립트 오류";
        stockShowBootError(msg + "\n\nSafari 설정 → 고급 → 웹 사이트 데이터 삭제 후 다시 시도해 보세요.");
      });

      setTimeout(function () {
        if (window.__STOCK_BOOT >= 2) return;
        stockShowBootError(
          "앱이 시작되지 않았습니다.\n\n캐시·네트워크 문제일 수 있습니다. Safari에서 이 사이트 데이터를 삭제한 뒤 새로고침해 주세요.",
        );
      }, 8000);
    </script>
  </body>
</html>
