<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>S&P 500 산업 구성 — 원형 차트</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --hover: #475569;
        font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse 120% 80% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
        color: var(--text);
        padding: 20px 16px 48px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.45rem;
        font-weight: 700;
        margin: 0 0 6px;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0;
        line-height: 1.5;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding: 4px;
        background: rgba(15, 23, 42, 0.6);
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .tab {
        flex: 1;
        min-width: 100px;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .tab:hover {
        color: var(--text);
        background: var(--hover);
      }
      .tab.active {
        background: var(--card);
        color: var(--accent);
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
      }
      .panel {
        display: none;
        animation: fade 0.2s ease;
      }
      .panel.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }
      .chart-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #donut {
        width: min(100%, 380px);
        height: auto;
        cursor: pointer;
      }
      .donut-seg {
        cursor: pointer;
        transition: opacity 0.15s, filter 0.15s;
      }
      .donut-seg:hover,
      .donut-seg.focused {
        filter: brightness(1.15);
      }
      .donut-seg.dimmed {
        opacity: 0.35;
      }
      .chart-center-title {
        font-size: 11px;
        fill: var(--muted);
      }
      .chart-center-value {
        font-size: 22px;
        font-weight: 700;
        fill: var(--text);
      }
      .chart-center-sub {
        font-size: 10px;
        fill: var(--muted);
      }
      .legend {
        width: 100%;
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 6px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.82rem;
        border: 1px solid transparent;
      }
      .legend-item:hover,
      .legend-item.active {
        background: rgba(56, 189, 248, 0.1);
        border-color: rgba(56, 189, 248, 0.35);
      }
      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .legend-pct {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .toolbar label {
        font-size: 0.82rem;
        color: var(--muted);
      }
      select,
      input[type="search"] {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.88rem;
      }
      input[type="search"] {
        min-width: 180px;
        flex: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.4);
        font-size: 0.82rem;
        margin-bottom: 12px;
      }
      .chip button {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0 2px;
        font-size: 1rem;
        line-height: 1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }
      th {
        text-align: left;
        padding: 10px 8px;
        color: var(--muted);
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      th:hover {
        color: var(--accent);
      }
      th.sorted {
        color: var(--accent);
      }
      td {
        padding: 9px 8px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        vertical-align: top;
      }
      tr:hover td {
        background: rgba(71, 85, 105, 0.2);
      }
      tr.row-click {
        cursor: pointer;
      }
      .sym {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      .bar-cell {
        min-width: 120px;
      }
      .bar-track {
        height: 8px;
        background: var(--bg);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        font-size: 0.9rem;
      }
      .stat-row strong {
        font-variant-numeric: tabular-nums;
      }
      .loading,
      .error {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
      }
      .error {
        color: #f87171;
      }
      .hint {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 10px;
        line-height: 1.45;
      }
      footer {
        margin-top: 24px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>S&P 500 산업 구성</h1>
        <p class="sub">
          GICS 섹터별 종목 수 비중 · 원형 차트에서 섹터를 클릭하면 탭이 전환되고
          해당 업종 종목을 정렬해 볼 수 있습니다.
        </p>
      </header>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="chart" role="tab">
          원형 차트
        </button>
        <button type="button" class="tab" data-tab="sectors" role="tab">
          섹터 비중
        </button>
        <button type="button" class="tab" data-tab="companies" role="tab">
          종목 목록
        </button>
      </div>

      <div id="loading" class="loading">S&P 500 데이터 불러오는 중…</div>
      <div id="error" class="error" hidden></div>

      <div id="app" hidden>
        <div id="panel-chart" class="panel active" role="tabpanel">
          <div class="grid">
            <div class="card chart-wrap">
              <svg
                id="donut"
                viewBox="0 0 400 400"
                aria-label="S&P 500 섹터 비중 원형 차트"
              ></svg>
              <p class="hint" id="chart-hint">
                조각 또는 범례를 클릭하면 섹터 상세 탭으로 이동합니다.
              </p>
            </div>
            <div class="card">
              <h2 style="margin: 0 0 12px; font-size: 1rem">선택 섹터</h2>
              <div id="sector-summary">
                <p class="sub" style="margin: 0">
                  차트에서 섹터를 선택하세요.
                </p>
              </div>
              <div style="margin-top: 20px">
                <h2 style="margin: 0 0 8px; font-size: 1rem">전체 요약</h2>
                <div id="overall-stats"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="panel-sectors" class="panel" role="tabpanel">
          <div class="card">
            <div class="toolbar">
              <label for="sector-sort">정렬</label>
              <select id="sector-sort">
                <option value="count-desc">종목 수 ↓</option>
                <option value="count-asc">종목 수 ↑</option>
                <option value="pct-desc">비중 % ↓</option>
                <option value="pct-asc">비중 % ↑</option>
                <option value="name-asc">섹터명 가나다</option>
                <option value="name-en">섹터명 A–Z</option>
              </select>
            </div>
            <div style="overflow-x: auto">
              <table id="sector-table">
                <thead>
                  <tr>
                    <th data-sort="sectorKo">섹터</th>
                    <th data-sort="count">종목 수</th>
                    <th data-sort="pct">비중</th>
                    <th>분포</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="panel-companies" class="panel" role="tabpanel">
          <div class="card">
            <div id="sector-chip" hidden class="chip">
              <span id="chip-label"></span>
              <button type="button" id="chip-clear" title="필터 해제">×</button>
            </div>
            <div class="toolbar">
              <input
                type="search"
                id="company-search"
                placeholder="티커·회사명·세부업종 검색…"
                autocomplete="off"
              />
              <label for="company-sort">정렬</label>
              <select id="company-sort">
                <option value="symbol-asc">티커 A–Z</option>
                <option value="symbol-desc">티커 Z–A</option>
                <option value="name-asc">회사명 A–Z</option>
                <option value="name-desc">회사명 Z–A</option>
                <option value="sector-asc">섹터</option>
                <option value="sub-asc">세부업종</option>
                <option value="date-desc">편입일 최신</option>
                <option value="date-asc">편입일 오래됨</option>
              </select>
            </div>
            <p class="hint" id="company-count"></p>
            <div style="overflow-x: auto; max-height: 70vh; overflow-y: auto">
              <table id="company-table">
                <thead>
                  <tr>
                    <th data-col="symbol">티커</th>
                    <th data-col="name">회사</th>
                    <th data-col="sectorKo">섹터</th>
                    <th data-col="subIndustry">세부업종</th>
                    <th data-col="dateAdded">편입일</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <footer id="footer-meta"></footer>
    </div>

    <script>
      const SECTOR_COLORS = {
        "Information Technology": "#38bdf8",
        "Health Care": "#34d399",
        Financials: "#fbbf24",
        "Consumer Discretionary": "#fb7185",
        "Communication Services": "#a78bfa",
        Industrials: "#94a3b8",
        "Consumer Staples": "#4ade80",
        Energy: "#f97316",
        Utilities: "#60a5fa",
        "Real Estate": "#e879f9",
        Materials: "#facc15",
        Unknown: "#64748b",
      };

      /** @type {object | null} */
      let data = null;
      let selectedSector = null;
      let activeTab = "chart";
      let sectorSortKey = "count-desc";
      let companySortKey = "symbol-asc";
      let companySearch = "";

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => [...document.querySelectorAll(sel)];

      function sectorColor(sector) {
        return SECTOR_COLORS[sector] ?? "#64748b";
      }

      function fmtPct(n) {
        return n.toFixed(1) + "%";
      }

      function setTab(tab) {
        activeTab = tab;
        $$(".tab").forEach((el) => {
          el.classList.toggle("active", el.dataset.tab === tab);
        });
        $$(".panel").forEach((el) => {
          el.classList.toggle("active", el.id === `panel-${tab}`);
        });
      }

      function selectSector(sector, goTab) {
        selectedSector = sector;
        renderDonut();
        renderLegend();
        renderSectorSummary();
        renderSectorChip();
        renderCompanies();
        if (goTab) setTab(goTab);
      }

      function polar(cx, cy, r, angle) {
        const rad = ((angle - 90) * Math.PI) / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
      }

      function arcPath(cx, cy, r0, r1, a0, a1) {
        const p0 = polar(cx, cy, r1, a0);
        const p1 = polar(cx, cy, r1, a1);
        const p2 = polar(cx, cy, r0, a1);
        const p3 = polar(cx, cy, r0, a0);
        const large = a1 - a0 > 180 ? 1 : 0;
        return [
          `M ${p0.x} ${p0.y}`,
          `A ${r1} ${r1} 0 ${large} 1 ${p1.x} ${p1.y}`,
          `L ${p2.x} ${p2.y}`,
          `A ${r0} ${r0} 0 ${large} 0 ${p3.x} ${p3.y}`,
          "Z",
        ].join(" ");
      }

      function renderDonut() {
        const svg = $("#donut");
        if (!data) return;
        const cx = 200;
        const cy = 200;
        const r0 = 88;
        const r1 = 155;
        let angle = 0;
        const parts = [];

        for (const s of data.sectors) {
          const sweep = (s.count / data.total) * 360;
          const a0 = angle;
          const a1 = angle + sweep;
          angle = a1;
          const focused = !selectedSector || selectedSector === s.sector;
          parts.push(`
            <path class="donut-seg ${focused ? "" : "dimmed"}${selectedSector === s.sector ? " focused" : ""}"
              d="${arcPath(cx, cy, r0, r1, a0, a1)}"
              fill="${sectorColor(s.sector)}"
              data-sector="${escapeAttr(s.sector)}"
              tabindex="0"
              role="button"
              aria-label="${escapeAttr(s.sectorKo)} ${s.count}종목 ${fmtPct(s.pct)}"
            />
          `);
        }

        const center =
          selectedSector != null
            ? data.sectors.find((s) => s.sector === selectedSector)
            : null;

        svg.innerHTML = `
          ${parts.join("")}
          <text class="chart-center-title" x="${cx}" y="${cy - 14}" text-anchor="middle">
            ${center ? center.sectorKo : "S&P 500"}
          </text>
          <text class="chart-center-value" x="${cx}" y="${cy + 14}" text-anchor="middle">
            ${center ? center.count : data.total}
          </text>
          <text class="chart-center-sub" x="${cx}" y="${cy + 32}" text-anchor="middle">
            ${center ? fmtPct(center.pct) : "종목"}
          </text>
        `;

        svg.querySelectorAll(".donut-seg").forEach((el) => {
          const sec = el.dataset.sector;
          const go = () => selectSector(sec, "companies");
          el.addEventListener("click", go);
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
        });
      }

      function renderLegend() {
        const host = document.querySelector(".legend");
        if (!host) {
          const wrap = $(".chart-wrap");
          const leg = document.createElement("div");
          leg.className = "legend";
          wrap.appendChild(leg);
        }
        const legend = document.querySelector(".legend");
        legend.innerHTML = data.sectors
          .map(
            (s) => `
          <div class="legend-item ${selectedSector === s.sector ? "active" : ""}" data-sector="${escapeAttr(s.sector)}">
            <span class="legend-swatch" style="background:${sectorColor(s.sector)}"></span>
            <span>${s.sectorKo}</span>
            <span class="legend-pct">${fmtPct(s.pct)}</span>
          </div>
        `,
          )
          .join("");
        legend.querySelectorAll(".legend-item").forEach((el) => {
          el.addEventListener("click", () =>
            selectSector(el.dataset.sector, "sectors"),
          );
        });
      }

      function renderSectorSummary() {
        const el = $("#sector-summary");
        if (!selectedSector) {
          el.innerHTML =
            '<p class="sub" style="margin:0">차트에서 섹터를 선택하세요.</p>';
          return;
        }
        const s = data.sectors.find((x) => x.sector === selectedSector);
        if (!s) return;
        const subs = {};
        for (const c of data.companies.filter((c) => c.sector === selectedSector)) {
          subs[c.subIndustry] = (subs[c.subIndustry] ?? 0) + 1;
        }
        const topSubs = Object.entries(subs)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5)
          .map(
            ([name, n]) =>
              `<div class="stat-row"><span>${name}</span><strong>${n}</strong></div>`,
          )
          .join("");
        el.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="width:14px;height:14px;border-radius:4px;background:${sectorColor(s.sector)}"></span>
            <strong style="font-size:1.1rem">${s.sectorKo}</strong>
            <span style="color:var(--muted);font-size:0.85rem">${s.sector}</span>
          </div>
          <div class="stat-row"><span>종목 수</span><strong>${s.count}</strong></div>
          <div class="stat-row"><span>전체 대비</span><strong>${fmtPct(s.pct)}</strong></div>
          <p style="margin:14px 0 6px;font-size:0.82rem;color:var(--muted)">주요 세부업종</p>
          ${topSubs}
          <button type="button" style="margin-top:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--accent);cursor:pointer;font-weight:600" id="btn-list-sector">
            이 섹터 종목 보기 →
          </button>
        `;
        $("#btn-list-sector").addEventListener("click", () =>
          setTab("companies"),
        );
      }

      function renderOverallStats() {
        $("#overall-stats").innerHTML = `
          <div class="stat-row"><span>총 종목</span><strong>${data.total}</strong></div>
          <div class="stat-row"><span>섹터 수</span><strong>${data.sectors.length}</strong></div>
          <div class="stat-row"><span>비중 기준</span><strong>${data.weightBasisLabel ?? "종목 수"}</strong></div>
        `;
      }

      function sortSectors(list) {
        const copy = [...list];
        const [key, dir] = sectorSortKey.split("-");
        copy.sort((a, b) => {
          let va;
          let vb;
          if (key === "count") {
            va = a.count;
            vb = b.count;
          } else if (key === "pct") {
            va = a.pct;
            vb = b.pct;
          } else if (key === "name") {
            va = dir === "en" ? a.sector : a.sectorKo;
            vb = dir === "en" ? b.sector : b.sectorKo;
            return String(va).localeCompare(String(vb), dir === "en" ? "en" : "ko");
          }
          return dir === "asc" ? va - vb : vb - va;
        });
        return copy;
      }

      function renderSectorTable() {
        const tbody = $("#sector-table tbody");
        const max = Math.max(...data.sectors.map((s) => s.count));
        tbody.innerHTML = sortSectors(data.sectors)
          .map(
            (s) => `
          <tr class="row-click" data-sector="${escapeAttr(s.sector)}">
            <td>
              <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${sectorColor(s.sector)};margin-right:6px"></span>
              ${s.sectorKo}
              <div style="font-size:0.75rem;color:var(--muted)">${s.sector}</div>
            </td>
            <td>${s.count}</td>
            <td>${fmtPct(s.pct)}</td>
            <td class="bar-cell">
              <div class="bar-track">
                <div class="bar-fill" style="width:${(s.count / max) * 100}%;background:${sectorColor(s.sector)}"></div>
              </div>
            </td>
          </tr>
        `,
          )
          .join("");
        tbody.querySelectorAll("tr").forEach((tr) => {
          tr.addEventListener("click", () =>
            selectSector(tr.dataset.sector, "companies"),
          );
        });
      }

      function renderSectorChip() {
        const chip = $("#sector-chip");
        if (!selectedSector) {
          chip.hidden = true;
          return;
        }
        const s = data.sectors.find((x) => x.sector === selectedSector);
        chip.hidden = false;
        $("#chip-label").textContent = s
          ? `${s.sectorKo} · ${s.count}종목`
          : selectedSector;
      }

      function filteredCompanies() {
        let list = data.companies;
        if (selectedSector) {
          list = list.filter((c) => c.sector === selectedSector);
        }
        const q = companySearch.trim().toLowerCase();
        if (q) {
          list = list.filter(
            (c) =>
              c.symbol.toLowerCase().includes(q) ||
              c.name.toLowerCase().includes(q) ||
              c.sectorKo.toLowerCase().includes(q) ||
              c.subIndustry.toLowerCase().includes(q),
          );
        }
        return sortCompanies(list);
      }

      function sortCompanies(list) {
        const copy = [...list];
        const [key, dir] = companySortKey.split("-");
        copy.sort((a, b) => {
          let va;
          let vb;
          switch (key) {
            case "symbol":
              va = a.symbol;
              vb = b.symbol;
              break;
            case "name":
              va = a.name;
              vb = b.name;
              break;
            case "sector":
              va = a.sectorKo;
              vb = b.sectorKo;
              break;
            case "sub":
              va = a.subIndustry;
              vb = b.subIndustry;
              break;
            case "date":
              va = a.dateAdded || "";
              vb = b.dateAdded || "";
              break;
            default:
              va = a.symbol;
              vb = b.symbol;
          }
          const cmp = String(va).localeCompare(String(vb), "en", {
            sensitivity: "base",
          });
          return dir === "desc" ? -cmp : cmp;
        });
        return copy;
      }

      function renderCompanies() {
        const rows = filteredCompanies();
        $("#company-count").textContent = `${rows.length}개 종목 표시`;
        const tbody = $("#company-table tbody");
        tbody.innerHTML = rows
          .map(
            (c) => `
          <tr data-sector="${escapeAttr(c.sector)}">
            <td class="sym">${c.symbol}</td>
            <td>${escapeHtml(c.name)}</td>
            <td>${c.sectorKo}</td>
            <td style="font-size:0.8rem;color:var(--muted)">${escapeHtml(c.subIndustry)}</td>
            <td style="font-size:0.8rem;color:var(--muted)">${c.dateAdded || "—"}</td>
          </tr>
        `,
          )
          .join("");
        tbody.querySelectorAll("tr").forEach((tr) => {
          tr.addEventListener("click", () => {
            selectSector(tr.dataset.sector, null);
            setTab("chart");
          });
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      function renderAll() {
        renderDonut();
        renderLegend();
        renderSectorSummary();
        renderOverallStats();
        renderSectorTable();
        renderSectorChip();
        renderCompanies();
        const dt = new Date(data.updatedAt);
        $("#footer-meta").textContent = `갱신: ${dt.toLocaleString("ko-KR")} · 출처: datasets/s-and-p-500-companies`;
      }

      $$(".tab").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });

      $("#sector-sort").addEventListener("change", (e) => {
        sectorSortKey = e.target.value;
        renderSectorTable();
      });

      $("#company-sort").addEventListener("change", (e) => {
        companySortKey = e.target.value;
        renderCompanies();
      });

      $("#company-search").addEventListener("input", (e) => {
        companySearch = e.target.value;
        renderCompanies();
      });

      $("#chip-clear").addEventListener("click", () => {
        selectedSector = null;
        renderAll();
      });

      $("#sector-table thead th").forEach((th) => {
        th.addEventListener("click", () => {
          const col = th.dataset.sort;
          if (col === "sectorKo") sectorSortKey = "name-asc";
          else if (col === "count")
            sectorSortKey =
              sectorSortKey === "count-desc" ? "count-asc" : "count-desc";
          else if (col === "pct")
            sectorSortKey =
              sectorSortKey === "pct-desc" ? "pct-asc" : "pct-desc";
          $("#sector-sort").value = sectorSortKey;
          renderSectorTable();
        });
      });

      $("#company-table thead th").forEach((th) => {
        th.addEventListener("click", () => {
          const col = th.dataset.col;
          const map = {
            symbol: ["symbol-asc", "symbol-desc"],
            name: ["name-asc", "name-desc"],
            sectorKo: ["sector-asc", "sector-desc"],
            subIndustry: ["sub-asc", "sub-desc"],
            dateAdded: ["date-desc", "date-asc"],
          };
          const pair = map[col];
          if (!pair) return;
          companySortKey =
            companySortKey === pair[0] ? pair[1] : pair[0];
          $("#company-sort").value = companySortKey;
          renderCompanies();
        });
      });

      async function load() {
        try {
          const res = await fetch("/api/sp500-sectors");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          data = await res.json();
          $("#loading").hidden = true;
          $("#app").hidden = false;
          renderAll();
        } catch (e) {
          $("#loading").hidden = true;
          const err = $("#error");
          err.hidden = false;
          err.textContent =
            "데이터를 불러오지 못했습니다. dev 서버(npm run dev) 실행 후 /sp500-sector-wheel.html 로 접속하세요. " +
            (e instanceof Error ? e.message : String(e));
        }
      }

      load();
    </script>
  </body>
</html>
